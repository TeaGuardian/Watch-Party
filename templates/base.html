<!-- #/templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if meta and meta.title %}{{ meta.title }}{% else %}Watch Party{% endif %}</title>
    {% if meta %}
    <meta property="og:title" content="{{ meta.title }}">
    <meta property="og:description" content="{{ meta.description }}">
    <meta property="og:type" content="website">
    {% endif %}
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                // Если сохранена светлая, ставим атрибут сразу
                if (savedTheme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    // Иначе (dark или нет записи) ставим dark (хотя CSS и так default dark)
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- Цвет плашки Safari -->
    <meta name="theme-color" content="#121212">
    <!-- iOS, это веб-приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Watch Party">
    <!-- Иконка для iPhone (Apple Touch Icon) -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/android-chrome-192x192.png') }}">
    <!-- основной CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Cropper.js для обрезки аватарок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- hls.js для плеера -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- Socket.IO клиент -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Сменить тему">
        <svg viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>

    <!-- Контейнер для всплывающих ошибок/уведомлений -->
    <div id="notification-area"></div>

    <!-- Основной контент -->
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>

    {% if show_footer %}
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="/policy">Правила</a>
                <span class="sep">•</span>
                <a href="https://t.me/South_Fox">Поддержка</a>
            </div>
            <div class="footer-info">
                {% if config.VERSION %}
                    <span>Watch Party [{{ config.VERSION }}] &copy; 2026</span>
                {% else %}
                    <span>Watch Party &copy; 2026</span>
                {% endif %}
                <span class="server-status"></span>
            </div>
        </div>
    </footer>
    {% endif %}

    <!-- Основной JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
