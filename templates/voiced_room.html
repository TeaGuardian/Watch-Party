<!-- #/templates/voiced_room.html -->
{% extends 'base.html' %}

{% block content %}
<!-- Подключаем стили голоса -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/room.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/voice.css') }}">

<div class="room-container">
    <!-- Оверлей доступа (как в room.html) -->
    <div id="access-overlay" class="access-overlay" style="display: none;">
        <div class="access-card">
            <h2>🔒 Комната закрыта</h2>
            <div id="access-buttons">
                <button class="btn btn-primary" onclick="sendKnock()">🚪 Постучаться</button>
            </div>
            <p id="access-status" class="access-status"></p>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 500px;">
            <h3>Настройки комнаты</h3>

            <!-- Вкладки внутри модалки (простые) -->
            <div style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                <button class="btn btn-sm btn-secondary" onclick="showSettingsTab('general')" style="width:auto; display:inline-block;">Общие</button>
                <button class="btn btn-sm btn-secondary" onclick="showSettingsTab('bans')" style="width:auto; display:inline-block;">Черный список</button>
            </div>

            <!-- TAB: General -->
            <div id="set-tab-general">
                <div class="input-container">
                    <input type="text" id="set-room-name" class="input-field" placeholder=" ">
                    <label class="input-label">Название</label>
                </div>

                <div class="input-container">
                    <label style="font-size: 12px; color: var(--text-muted);">Цвет шапки</label>
                    <input type="color" id="set-room-color" style="width: 100%; height: 40px; border:none; cursor:pointer;">
                </div>

                <div class="checkbox-container" style="justify-content: flex-start;">
                    <input type="checkbox" id="set-is-private">
                    <label for="set-is-private">Закрытая комната (доступ по стуку)</label>
                </div>

                <div class="checkbox-container" style="justify-content: flex-start;">
                    <input type="checkbox" id="set-guest-control">
                    <label for="set-guest-control">Разрешить гостям управлять плеером</label>
                </div>

                <button class="btn btn-primary" onclick="saveRoomSettings()">Сохранить</button>
            </div>

            <!-- TAB: Bans -->
            <div id="set-tab-bans" style="display: none;">
                <div id="banned-list" class="playlist-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">
                    <!-- Список загрузится JS -->
                </div>
                <p style="font-size:12px; color:var(--text-muted)">Чтобы забанить пользователя, нажмите ⛔ на его аватаре в списке зрителей.</p>
            </div>

            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="document.getElementById('settings-modal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <div id="knock-toast-container" class="knock-toast-container"></div>

    <!-- Всплывающее меню громкости (НОВОЕ) -->
    <div id="volume-popover" class="volume-popover">
        <div>
            <span id="vol-username">User</span>
            <span id="vol-value" class="volume-value">100%</span>
        </div>
        <input type="range" id="vol-slider" class="volume-slider" min="0" max="200" step="5">
    </div>

    <!-- ЛЕВАЯ КОЛОНКА -->
    <div class="video-section">
        <div class="video-wrapper">
            <video id="video-player" controls></video>
            <div id="video-overlay" class="video-overlay" style="display: none;">
                <div class="spinner"></div>
                <p id="overlay-text">Загрузка...</p>
            </div>
        </div>

        <div class="room-info-bar">
            <h2 id="room-name">Комната</h2>

            <!-- Кнопки управления комнатой -->
            <button class="btn-icon" onclick="copyLink()" title="Ссылка">🔗</button>
            <button class="btn-icon" onclick="location.href='/'" title="Выход">🏠</button>
            <button id="btn-settings" class="btn-icon" onclick="openSettingsModal()" style="display:none;" title="Настройки">⚙️</button>

            <!-- [NEW] Voice Controls -->
            <div class="voice-controls">
                <button id="btn-join-voice" class="btn-voice" onclick="VoiceClient.join()" title="Подключиться к голосу">
                    📞
                </button>

                <button id="btn-mic" class="btn-voice active" onclick="VoiceClient.toggleMic()" style="display:none" title="Микрофон">
                    🎤
                </button>
                <button id="btn-sound" class="btn-voice active" onclick="VoiceClient.toggleSound()" style="display:none" title="Звук (Наушники)">
                    🎧
                </button>
            </div>
        </div>

        <!-- Зрители -->
        <div class="viewers-section">
            <h4>Участники</h4>
            <div id="viewers-list" class="viewers-grid">
                <!-- Сюда JS room.js добавляет карточки, а voice.js их дополняет -->
            </div>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА (Чат и Плейлист) - идентична room.html -->
    <div class="sidebar-section">
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="switchSidebar('chat')">Чат</button>
            <button class="sidebar-tab" onclick="switchSidebar('playlist')">Плейлист</button>
        </div>
        <div id="sidebar-chat" class="sidebar-content active">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="..." onkeypress="handleChatKey(event)">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
        <div id="sidebar-playlist" class="sidebar-content">
            <div id="playlist-container" class="playlist-list"></div>
            <div id="owner-controls" class="playlist-controls" style="display: none;">
                <button class="btn btn-primary btn-sm" onclick="triggerUpload()">+ Видео</button>
                <input type="file" id="file-upload" style="display:none" onchange="uploadVideo(this)">
                <div id="upload-progress" class="upload-progress" style="display:none">Loading...</div>
            </div>
        </div>
    </div>
</div>

<!-- Передаем данные в JS -->
<script>
    const ROOM_UUID = "{{ room_uuid }}";
    const MAX_VIDEO_SIZE = {{ max_video_size }};
    const USER_ID = {{ current_user.id }};
    const RETENTION_HOURS = {{ video_retention_hours }};
</script>
{% endblock %}

{% block scripts %}
<!-- Скрипт основной логики комнаты (видео, чат) -->
<script src="{{ url_for('static', filename='js/room.js') }}"></script>
<!-- Скрипт голосового чата -->
<script src="{{ url_for('static', filename='js/voice.js') }}"></script>
{% endblock %}
