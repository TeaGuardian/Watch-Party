
services:
  # --- Nginx (Updated for SSL) ---
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфиг теперь монтируем напрямую в conf.d
      - ./startup_scripts/nginx.conf:/etc/nginx/conf.d/default.conf
      # Тома для SSL
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
      - voice_service
    # Команда запуска: запускает Nginx и фоном каждые 6 часов просит его перезагрузить конфиги (чтобы подхватить новые серты)
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Сервис certbot удален полностью

  # --- 2. Database (Postgres) ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # --- 3. Redis ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- 4. MinIO ---
  minio:
    image: minio/minio:RELEASE.2023-01-25T00-19-54Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # Важно: 9000 прокидываем наружу, так как S3_ENDPOINT в .env будет указывать на внешний IP
      - "9000:9000"
      # Консоль админа MinIO (по желанию, можно убрать если не нужна снаружи)
      - "9001:9001"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # --- 5. MinIO Setup ---
  createbuckets:
    image: minio/mc:RELEASE.2023-08-29T22-55-06Z
    depends_on:
      - minio
    env_file: .env
    volumes:
      - ./startup_scripts:/startup_scripts
    entrypoint: /bin/sh /startup_scripts/minio_startup.sh

  # Отдельный контейнер для Бота
  bot:
    build: .
    container_name: tg_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    # Запускаем наш новый скрипт
    command: python run_bot.py
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- 6. Main Web Application ---
  web:
    build: .
    container_name: web_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - temp_uploads:/app/storage/uploads
    depends_on:
      - postgres
      - redis
      - minio
    # Добавляем extra_hosts, чтобы контейнер мог обратиться к хосту по внешнему IP (для MinIO)
    # Это "хак" для связи с S3_ENDPOINT=IP:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:8000 main:app
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 800M

# --- 7.1 Celery Fast Worker (Для легких файлов) ---
  celery_fast:
    build: .
    container_name: celery_fast
    restart: unless-stopped
    env_file: .env
    volumes:
      - temp_uploads:/app/storage/uploads
    depends_on:
      - postgres
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -Q fast_queue -c ${FAST_WORKER_CONCURRENCY:-3} --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # --- 7.2 Celery Heavy Worker (Для тяжелых файлов) ---
  celery_heavy:
    build: .
    container_name: celery_heavy
    restart: unless-stopped
    env_file: .env
    volumes:
      - temp_uploads:/app/storage/uploads
    depends_on:
      - postgres
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A tasks.celery_app worker -Q heavy_queue -c ${HEAVY_WORKER_CONCURRENCY:-2} --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 1024M

  # --- 8. Celery Beat (Планировщик - без изменений) ---
  celery_beat:
    build: .
    container_name: celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: celery -A tasks.celery_app beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  voice_service:
    build:
      context: .
      dockerfile: Dockerfile.voice
    container_name: voice_service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001" # Для отладки, в проде закроем Nginx-ом
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- Certbot (New) ---
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Проверка обновлений каждые 12 часов
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  minio_data:
  redis_data:
  temp_uploads: