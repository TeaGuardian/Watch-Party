# startup_scripts/nginx.conf

client_max_body_size 3000M;

upstream web_upstream {
    server web:8000;
}

upstream voice_upstream {
    server voice_service:8001;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name w2sys.su www.w2sys.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name w2sys.su www.w2sys.su;

    ssl_certificate /etc/letsencrypt/live/w2sys.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w2sys.su/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- MAIN WEB APP ---
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # --- INTERNAL ---
    location /api/internal/ {
        deny all;
        return 403;
    }

    # --- SOCKET.IO ---
    location /socket.io/ {
        proxy_pass http://web_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- VOICE SERVICE ---
    location /socket.io/voice/ {
        proxy_pass http://voice_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- S3 / MINIO PROXY ---
    # Перехватываем запросы на /s3/ и шлем их в MinIO
    location /s3/ {
        proxy_pass http://minio:9000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Скрываем заголовки MinIO (опционально)
        proxy_hide_header      x-amz-request-id;
        proxy_hide_header      x-amz-id-2;
    }
}